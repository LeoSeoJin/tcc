message PbRpcTccCureKVInternalTxSliceGetArg {
    required bytes Key = 1;
    repeated PbPhysicalTimeSpec DV = 2;
    optional int64 id = 3;
    optional int64 src = 4;
}

message PbRpcTccCureKVInternalTxSliceGetResult {
    required bool Succeeded = 1;
    required bytes GetValue = 2;
    optional int32 SrcReplica = 3;
    optional double waitedXact = 4;
    optional int64 id = 5;
    optional int64 src = 6;
}

message PbRpcTccCureKVInternalTxSliceReadKeysArg {
    repeated bytes Key = 1;
    repeated PbPhysicalTimeSpec DV = 2;
    optional int64 id = 3;
    optional int64 src = 4;
}

message PbRpcTcCureKVInternalSliceReadKeysArg {
    repeated bytes Key = 1;
    repeated PbPhysicalTimeSpec RDV = 2;
	repeated PbPhysicalTimeSpec WDV = 3;
    optional int64 id = 4;
    optional int64 src = 5;
}

message PbRpcTcCureKVInternalSliceReadKeysResult {
    required bool Succeeded = 1;
    repeated bytes Value = 2;
    repeated PbPhysicalTimeSpec UT = 3;
	repeated PbPhysicalTimeSpec CSS = 4;
    optional int32 SrcReplica = 5;
    optional double waitedXact = 6;
    optional int64 id = 7;
    optional int64 src = 8;  // read from which partition
}

message PbRpcCureKVInternalSliceReadKeysResult {
    required bool Succeeded = 1;
    repeated bytes Value = 2;
    repeated PbPhysicalTimeSpec UT = 3;
    optional int32 SrcReplica = 4;
    optional double waitedXact = 5;
    optional int64 id = 6;
    optional int64 src = 7;  // read from which partition
}

message PbRpcTccCureKVInternalTxSliceReadKeysResult {
    required bool Succeeded = 1;
    repeated bytes Value = 2;
    optional int32 SrcReplica = 3;
    optional double waitedXact = 4;
    optional int64 id = 5;
    optional int64 src = 6;
}

message PbRpcTccCurePartitionClientPrepareRequestArg{
    required int64 id = 1;
    repeated PbPhysicalTimeSpec DV = 2;
    repeated bytes Key = 3;
    repeated bytes Value = 4;
    required int64 src = 5;
}

message PbRpcCurePartitionClientWriteRequestArg{
    required int64 id = 1;
    repeated PbPhysicalTimeSpec DV = 2;
    repeated bytes Key = 3;
    repeated bytes Value = 4;
    required int64 src = 5;
}

message PbRpcTccCureKVPublicGetServerConfigResult {
    required bool Succeeded = 1;
    required int32 NumPartitions = 2;
    required int32 NumReplicasPerPartition = 3;
    required int32 replicaId = 4;
}

message PbRpTccCureCommitRequestArg{
    required int64 id = 1;
    repeated PbPhysicalTimeSpec CT = 2; //commit time vector
}


